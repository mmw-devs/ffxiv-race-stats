name: Sync Issue to Feishu

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, assigned, unassigned, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue 编号'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure lark-cli
        run: |
          echo "${{ secrets.FEISHU_APP_SECRET }}" | npx lark-cli profile add \
            --name ci-bot \
            --app-id "${{ secrets.FEISHU_APP_ID }}" \
            --app-secret-stdin \
            --use \
            --brand feishu

      - name: Sync Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_BITABLE_TOKEN: ${{ secrets.FEISHU_BITABLE_TOKEN }}
          FEISHU_ISSUE_TABLE_ID: ${{ secrets.FEISHU_ISSUE_TABLE_ID }}
          FEISHU_PR_TABLE_ID: ${{ secrets.FEISHU_PR_TABLE_ID }}
        run: |
          chmod +x .github/scripts/sync-gh-to-bitable.sh
          .github/scripts/sync-gh-to-bitable.sh issue \
            ${{ github.event.issue.number || inputs.issue_number }}
