name: "race-ops: JIT PEM Issuance"

# ────────────────────────────────────────────────────────────────
# 用途: 为开发者签发 1 小时有效的 installation token 用于功能测试
# 触发: workflow_dispatch（开发者通过 gh CLI 触发）
# 鉴权: 触发者需有 repo write 权限（Maintain / Admin）
# 安全:
#   - 生产 PEM 始终在 Org Secret 中，workflow 临时使用后丢弃
#   - Installation token 由 GitHub API 铸造，原生 1 小时 TTL
#   - 全程审计（GitHub Issue 由 race-ops-auditor 账号创建）
#
# 历史: 早期版本尝试 POST /app/private_keys 创建新 PEM key,
#       但该端点返回 404 (GitHub 已知问题, 不支持程序化创建).
#       改为铸造 installation token 解决。
# ────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: '用途说明（必填，写入审计日志）'
        type: string
        required: true

# 防止同一成员并发申请多个 token
concurrency:
  group: jit-pem-${{ github.actor }}
  cancel-in-progress: false

# 默认 token 仅读
permissions:
  contents: read

jobs:
  issue-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ── 1. 用生产 PEM 铸 App JWT ────────────────────────────
      - name: Generate App JWT
        id: jwt
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          IAT=$((NOW - 60))
          EXP=$((IAT + 540))
          HEADER='{"alg":"RS256","typ":"JWT"}'
          PAYLOAD="{\"iat\":$IAT,\"exp\":$EXP,\"iss\":\"${{ secrets.RACE_OPS_APP_ID }}\"}"

          HEADER_B64=$(printf '%s' "$HEADER" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          PAYLOAD_B64=$(printf '%s' "$PAYLOAD" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          SIGN_INPUT="${HEADER_B64}.${PAYLOAD_B64}"
          SIGNATURE=$(printf '%s' "$SIGN_INPUT" | openssl dgst -sha256 -sign <(printf '%s' "${{ secrets.RACE_OPS_PEM }}") | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          echo "jwt=${SIGN_INPUT}.${SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "✓ JWT 已生成"

      # ── 2. 铸造 installation token（核心）───────────────────
      - name: Mint installation token
        id: mint
        env:
          JWT: ${{ steps.jwt.outputs.jwt }}
        run: |
          set -euo pipefail
          INSTALLATION_ID="${{ secrets.RACE_OPS_INSTALLATION_ID }}"

          echo "⏳ 铸造 installation token (Installation ID: ${INSTALLATION_ID})..."

          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")

          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          EXPIRES_AT=$(echo "$RESPONSE" | jq -r '.expires_at // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::铸造 installation token 失败"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "✓ Token 已铸造"
          echo "  到期: ${EXPIRES_AT}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          echo "expires_at=${EXPIRES_AT}" >> "$GITHUB_OUTPUT"

      # ── 3. 验证 token 身份 ──────────────────────────────────
      - name: Verify token identity
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          echo "✓ Token 身份验证:"
          gh auth status 2>&1 | head -5
          echo ""
          # /app 需要 App JWT (PEM), 不能用 installation token 调.
          # 改用 installation-level 端点验证 (rate limit API)
          echo "✓ 安装 token 资源信息:"
          RATE_LIMIT=$(gh api /rate_limit -q '.resources.core.remaining')
          echo "  API 剩余配额: ${RATE_LIMIT}"
          echo "  ✓ Token 有效"

      # ── 4. 交付 token 给开发者 ──────────────────────────────
      - name: Deliver token to requester
        env:
          TOKEN: ${{ steps.mint.outputs.token }}
          EXPIRES_AT: ${{ steps.mint.outputs.expires_at }}
        run: |
          set -euo pipefail
          # mask 防止意外日志泄漏
          echo "::add-mask::${TOKEN}"

          # 计算剩余有效时间（GitHub 强制 1 小时）
          EXPIRES_LOCAL=$(date -d "${EXPIRES_AT}" +%Y-%m-%dT%H:%M:%S%z 2>/dev/null || echo "${EXPIRES_AT}")

          cat <<EOF
          ╔════════════════════════════════════════════════════╗
          ║   🚀 race-ops Installation Token 已签发              ║
          ╠════════════════════════════════════════════════════╣
          ║                                                    ║
          ║   持有者:        ${{ github.actor }}                       ║
          ║   Token 类型:    ghs_ (GitHub App installation)   ║
          ║   有效期:        1 小时（GitHub API 强制上限）      ║
          ║   到期时间:      ${EXPIRES_AT}   ║
          ║   Run ID:        ${{ github.run_id }}                      ║
          ║   用途:          ${{ inputs.purpose }}                     ║
          ║                                                    ║
          ║   注意:                                            ║
          ║   - 这是 installation token，不是 PEM               ║
          ║   - 原生 1 小时 TTL, GitHub API 不支持更短          ║
          ║   - 测试完请 unset GH_TOKEN                         ║
          ║                                                    ║
          ╠════════════════════════════════════════════════════╣
          ║   使用方式:                                         ║
          ║                                                    ║
          ║   export GH_TOKEN=${TOKEN}     ║
          ║                                                    ║
          ║   # 测试                                               ║
          ║   gh auth status                                   ║
          ║   gh pr list                                       ║
          ║                                                    ║
          ║   # 模拟 ops 推 content/*                            ║
          ║   gh pr create --base main --head content/xxx ...  ║
          ║                                                    ║
          ║   # 清理                                              ║
          ║   unset GH_TOKEN                                   ║
          ║                                                    ║
          ╚════════════════════════════════════════════════════╝
          EOF

      # ── 5. 写审计 issue（race-ops-auditor）────────────────
      - name: Create audit issue
        if: ${{ env.AUDIT_BOT_TOKEN != '' }}
        env:
          AUDIT_BOT_TOKEN: ${{ secrets.AUDIT_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AUDIT_BOT_TOKEN }}
        run: |
          set -euo pipefail
          EXPIRES_AT="${{ steps.mint.outputs.expires_at }}"
          TRIGGER_IP=$(curl -sS https://api.ipify.org || echo "unknown")
          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          BODY=$(printf '## JIT Installation Token 签发审计\n\n| 字段 | 值 |\n|------|-----|\n| 申请时间 | `%s` |\n| 持有者 | `%s` |\n| Token 类型 | installation (1h TTL) |\n| 到期时间 | `%s` |\n| 用途 | %s |\n| Run ID | `%s` |\n| 触发 IP | `%s` |\n| 状态 | 🟢 活跃 |\n\n---\n*本 issue 由 race-ops-auditor 自动创建。*' \
            "$NOW_ISO" \
            "${{ github.actor }}" \
            "$EXPIRES_AT" \
            "${{ inputs.purpose }}" \
            "${{ github.run_id }}" \
            "$TRIGGER_IP")

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔑 [JIT] token issued to ${{ github.actor }}" \
            --label "jit-audit,race-ops" \
            --body "$BODY")

          echo "✓ 审计 issue 已创建: ${ISSUE_URL}"
