name: build-verify

# ────────────────────────────────────────────────────────────────
# 用途: dev PR 触发，验证 src/ 与构建配置可成功编译
# 触发:
#   - pull_request（opened, synchronize, reopened）
#   - workflow_dispatch（手动重新验证）
# 验证:
#   - npm ci 依赖安装
#   - 数据副本守卫（dev 不得再出现 agent-src/public/data.json）
#   - npm run build Astro 构建（确保 src/ 改动可产出 dist/）
# 这是 dev 仓库 branch protection 的唯一必需状态检查
# ────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard — dev 不得持有数据副本
        run: |
          if [ -f agent-src/public/data.json ] || git diff --name-only --diff-filter=AM origin/main...HEAD | grep -qE '^agent-src/public/data\.json$'; then
            echo "::error::dev 仓库不再保存数据副本（agent-src/public/data.json 已于 #208 移除）"
            echo "::error::数据唯一事实源是 ops 仓库 mmw-devs/ffxiv-race-ops 的 public/data.json"
            echo "::error::预览构建由 scripts/fetch-preview-data.mjs 从生产站拉取"
            echo "::error::如需改数据，请到 ops 仓库发起 content/* PR"
            exit 1
          fi
          echo "✓ 未引入数据副本"

      - name: Generate types from schema
        run: npm run typegen

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size
