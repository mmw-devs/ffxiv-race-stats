name: build-verify

# ────────────────────────────────────────────────────────────────
# 用途: dev PR 触发，验证 src/ 与构建配置可成功编译
# 触发:
#   - pull_request（opened, synchronize, reopened）
#   - workflow_dispatch（手动重新验证）
# 验证:
#   - npm ci 依赖安装
#   - 数据副本守卫（dev 不得保存 data.json，唯一真源在 ops 仓库）
#   - typegen / typecheck / data-path:check / test:unit / lint / build / size
# 这是 dev 仓库 branch protection 的唯一必需状态检查
# ────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard — dev 不得保存数据副本
        run: |
          if [ -f agent-src/public/data.json ] || [ -f public/data.json ]; then
            echo "::error::dev 仓库不得保存 data.json 副本（SSOT：唯一真源在 ops 仓库）"
            echo "::error::真源：mmw-devs/ffxiv-race-ops 的 public/data.json"
            echo "::error::构建时由 scripts/fetch-build-data.mjs 读取；本地 npm run dev 走 Vite 代理"
            exit 1
          fi
          if git diff --name-only --diff-filter=ACMR origin/main...HEAD | grep -qE '(^|/)data\.json$'; then
            echo "::error::本 PR 引入了 data.json 副本；dev 仓库不保存数据"
            exit 1
          fi
          echo "✓ 未引入数据副本"

      - name: Generate types from schema
        run: npm run typegen

      - name: Guard — generated types committed
        run: git diff --exit-code -- types/

      - name: Type-check
        run: npm run typecheck

      - name: Check data path consistency
        run: npm run data-path:check

      - name: Unit tests
        run: npm run test:unit

      - name: Business rule fixtures
        run: npm run test:business-rules

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size
