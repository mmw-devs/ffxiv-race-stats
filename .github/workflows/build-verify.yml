name: build-verify

# ────────────────────────────────────────────────────────────────
# 用途: dev PR 触发，验证 src/ 与构建配置可成功编译
# 触发:
#   - pull_request（opened, synchronize, reopened）
#   - workflow_dispatch（手动重新验证）
# 验证:
#   - npm ci 依赖安装
#   - 数据副本守卫（agent-src/public/data.json 只允许 ops-sync/* 同步分支改动）
#   - npm run build Astro 构建（确保 src/ 改动可产出 dist/）
# 这是 dev 仓库 branch protection 的唯一必需状态检查
# ────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard — data.json 只能由 ops 同步引入
        run: |
          if git diff --quiet origin/main...HEAD -- agent-src/public/data.json; then
            echo "✓ 未改动数据副本"
            exit 0
          fi
          case "${GITHUB_HEAD_REF}" in
            ops-sync/*)
              echo "✓ ops-sync/* 同步分支，放行"
              ;;
            *)
              echo "::error::agent-src/public/data.json 只能由 ops 仓库 CI 同步更新（ops-sync/* 分支）"
              echo "::error::真源是 mmw-devs/ffxiv-race-ops 的 public/data.json"
              echo "::error::改数据请到 ops 仓库发起 content/* PR，ops CI 会自动同步到 dev 并开 PR"
              exit 1
              ;;
          esac
          node -e "
            const d = require('./agent-src/public/data.json');
            const need = ['meta','teams','news','broadcasters','notices','sponsors'];
            const miss = need.filter(k => !(k in d));
            if (miss.length) { console.error('缺少顶层字段: ' + miss.join(',')); process.exit(1); }
            if (!Array.isArray(d.meta?.dungeons)) { console.error('meta.dungeons 应为数组'); process.exit(1); }
            console.log('✓ 同步数据结构完整（teams=' + d.teams.length + '）');
          "

      - name: Generate types from schema
        run: npm run typegen

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size
