name: sync-agent-src

# ────────────────────────────────────────────────────────────────
# 用途: 把 dev 仓库 agent-src/ 内容同步到 ops 仓库
# 触发:
#   - push 到 main（仅当 agent-src/** 变更）
#   - workflow_dispatch（手动重新同步）
# 凭证:
#   - OPS_PUSH_TOKEN：GitHub PAT 或 GitHub App token
#     权限要求：仅对 mmw-devs/ffxiv-race-ops 有 contents:write
#     与 build-dist.yml 复用同一个 Secret
# 同步策略:
#   - rsync --delete + 多个 --exclude
#   - 排除 .git/（agent-src 嵌入的 git 元数据）
#   - 排除 dist/（由 build-dist.yml 独立管理）
#   - 排除 public/data.json（由 ops agent 直接管理）
#   - 排除 *:Zone.Identifier（WSL 元数据）
#   - 排除 node_modules（依赖不入仓）
# 冲突处理:
#   - 先 git pull --rebase 同步 ops 仓库自己的 commit
#   - rebase 冲突时失败退出（不强制覆盖）
# 并发:
#   - 与 build-dist.yml 串行（同一 group: sync-ops）
#   - 避免同时向 ops main 推送造成 race condition
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'agent-src/**'
  workflow_dispatch:

concurrency:
  group: sync-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync agent-src to ops repo
        env:
          OPS_PUSH_TOKEN: ${{ secrets.OPS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          # 校验 token 存在
          if [ -z "$OPS_PUSH_TOKEN" ]; then
            echo "::error::未配置 OPS_PUSH_TOKEN Secret，无法推送到 ops 仓库"
            echo "::error::请在 dev 仓库 Settings → Secrets and variables → Actions 中配置"
            echo "::error::token 需对 mmw-devs/ffxiv-race-ops 有 contents:write 权限"
            exit 1
          fi

          # 校验当前仓库（防止误装到 ops 仓库后误推）
          if [ "$GITHUB_REPOSITORY" != "mmw-devs/ffxiv-race-stats" ]; then
            echo "::error::本 workflow 只能在 dev 仓库（mmw-devs/ffxiv-race-stats）运行"
            echo "::error::当前仓库: $GITHUB_REPOSITORY"
            exit 1
          fi

          OPS_REPO="mmw-devs/ffxiv-race-ops"

          # 克隆 ops 仓库
          git clone "https://x-access-token:${OPS_PUSH_TOKEN}@github.com/${OPS_REPO}.git" ops-repo
          cd ops-repo
          git config user.name "ffxiv-race-dev-ci"
          git config user.email "ffxiv-race-dev-ci@users.noreply.github.com"

          # 先 rebase 处理 ops 仓库自己的 commit（agent 自动 merge 等）
          if ! git pull --rebase origin main; then
            echo "::error::rebase 失败，ops 仓库可能有冲突，需要人工处理"
            exit 1
          fi

          # 同步 agent-src 到 ops 工作区
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='public/data.json' \
            --exclude='*:Zone.Identifier' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            ../agent-src/ ./

          # 仅在有变更时提交
          git add -A
          if git diff --cached --quiet; then
            echo "ops 仓库内容无变化，跳过提交"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          git commit -m "chore(ops): sync from dev (${SHORT_SHA})"
          git push origin main
          echo "✓ agent-src 已同步到 ${OPS_REPO} main"
