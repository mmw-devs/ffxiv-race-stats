name: sync-agent-src

# ────────────────────────────────────────────────────────────────
# 用途: 把 dev 仓库 agent-src/ 内容同步到 ops 仓库
# 触发:
#   - push 到 main（仅当 agent-src/** 变更）
#   - workflow_dispatch（手动重新同步）
# 凭证:
#   - 使用 agent-src-sync GitHub App（专属同步 App）
#     权限：contents:write + workflows:write
#     App ID: 4561953
#     Installation ID: 153002155（mmw-devs/ffxiv-race-ops）
#   - Secrets:
#     - AGENT_SRC_SYNC_APP_ID
#     - AGENT_SRC_SYNC_INSTALLATION_ID
#     - AGENT_SRC_SYNC_APP_PEM
# 同步策略:
#   - rsync --delete + 多个 --exclude
#   - 排除 .git/（agent-src 嵌入的 git 元数据）
#   - 排除 dist/（由 build-dist.yml 独立管理）
#   - 排除 public/data.json（由 ops agent 直接管理）
#   - 排除 *:Zone.Identifier（WSL 元数据）
#   - 排除 node_modules（依赖不入仓）
# 冲突处理:
#   - 先 git pull --rebase 同步 ops 仓库自己的 commit
#   - rebase 冲突时失败退出（不强制覆盖）
# 并发:
#   - 与 build-dist.yml 串行（同一 group: sync-ops）
#   - 避免同时向 ops main 推送造成 race condition
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'agent-src/**'
  workflow_dispatch:

concurrency:
  group: sync-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Sync agent-src to ops repo
        env:
          AGENT_SRC_SYNC_APP_ID: ${{ secrets.AGENT_SRC_SYNC_APP_ID }}
          AGENT_SRC_SYNC_INSTALLATION_ID: ${{ secrets.AGENT_SRC_SYNC_INSTALLATION_ID }}
          AGENT_SRC_SYNC_APP_PEM: ${{ secrets.AGENT_SRC_SYNC_APP_PEM }}
        run: |
          set -euo pipefail

          # 校验凭证
          if [ -z "$AGENT_SRC_SYNC_APP_ID" ] || [ -z "$AGENT_SRC_SYNC_INSTALLATION_ID" ] || [ -z "$AGENT_SRC_SYNC_APP_PEM" ]; then
            echo "::error::未配置 agent-src-sync App 凭证"
            echo "::error::请配置 AGENT_SRC_SYNC_APP_ID, AGENT_SRC_SYNC_INSTALLATION_ID, AGENT_SRC_SYNC_APP_PEM"
            exit 1
          fi

          # 校验当前仓库
          if [ "$GITHUB_REPOSITORY" != "mmw-devs/ffxiv-race-stats" ]; then
            echo "::error::本 workflow 只能在 dev 仓库运行"
            echo "::error::当前仓库: $GITHUB_REPOSITORY"
            exit 1
          fi

          OPS_REPO="mmw-devs/ffxiv-race-ops"

          # ── 1. 用 PEM 铸 App JWT ─────────────────────────────
          NOW=$(date +%s)
          IAT=$((NOW - 60))
          EXP=$((IAT + 540))
          HEADER='{"alg":"RS256","typ":"JWT"}'
          PAYLOAD="{\"iat\":${IAT},\"exp\":${EXP},\"iss\":\"${AGENT_SRC_SYNC_APP_ID}\"}"

          HEADER_B64=$(printf '%s' "$HEADER" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          PAYLOAD_B64=$(printf '%s' "$PAYLOAD" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          SIGN_INPUT="${HEADER_B64}.${PAYLOAD_B64}"
          SIGNATURE=$(printf '%s' "$SIGN_INPUT" | openssl dgst -sha256 -sign <(printf '%s' "$AGENT_SRC_SYNC_APP_PEM") | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          JWT="${SIGN_INPUT}.${SIGNATURE}"
          echo "✓ JWT 已生成"

          # ── 2. 铸造 Installation Token ─────────────────────
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${AGENT_SRC_SYNC_INSTALLATION_ID}/access_tokens")

          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::铸造 installation token 失败"
            echo "Response: $RESPONSE"
            exit 1
          fi
          echo "✓ Installation token 已铸造"

          # ── 3. 克隆 ops 仓库 ───────────────────────────────
          git clone "https://x-access-token:${TOKEN}@github.com/${OPS_REPO}.git" ops-repo
          cd ops-repo
          git config user.name "agent-src-sync[bot]"
          git config user.email "agent-src-sync[bot]@users.noreply.github.com"

          # ── 4. rebase 处理 ops 仓库自己的 commit ──────────
          if ! git pull --rebase origin main; then
            echo "::error::rebase 失败，ops 仓库可能有冲突，需要人工处理"
            exit 1
          fi

          # ── 5. rsync agent-src 到 ops 工作区 ───────────────
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='public/data.json' \
            --exclude='*:Zone.Identifier' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            ../agent-src/ ./

          # 仅在有变更时提交
          git add -A
          if git diff --cached --quiet; then
            echo "ops 仓库内容无变化，跳过提交"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          git commit -m "chore(ops): sync from dev (${SHORT_SHA})"
          git push origin main
          echo "✓ agent-src 已同步到 ${OPS_REPO} main"
