name: sync-data-to-dev

# ────────────────────────────────────────────────────────────────
# 用途: ops 仓库 public/data.json 变更后，自动同步到 dev 仓库
# 触发:
#   - push 到 main（仅当 public/data.json 变更）
#   - workflow_dispatch（手动重新同步）
# 凭证:
#   - DEV_PUSH_TOKEN：GitHub PAT 或 GitHub App token
#     权限要求：对 mmw-devs/ffxiv-race-stats 有 contents:write + pull-requests:write
#     配置位置：ops 仓库 Settings → Secrets and variables → Actions
# 同步策略:
#   - 克隆 dev 仓库
#   - 创建 ops-sync/data-<ops 短 SHA> 分支（每次同步独立，避免复用分支导致的非快进推送失败）
#   - 复制 ops public/data.json 到 dev agent-src/public/data.json
#   - push 分支并用 gh CLI 开 PR
#   - PR body 走 --body-file（heredoc），不要把多行文本直接内联进 YAML 块标量：
#     顶格的 body 行会提前截断 `run: |`，GitHub 判定为 workflow file issue，连 job 都不创建
#   - dev 仓库 build-verify.yml 对 ops-sync/* 分支放行，并校验副本结构完整性
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'public/data.json'
  workflow_dispatch:

concurrency:
  group: sync-data-to-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync data.json to dev repo
        env:
          DEV_PUSH_TOKEN: ${{ secrets.DEV_PUSH_TOKEN }}
          OPS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 校验 token
          if [ -z "$DEV_PUSH_TOKEN" ]; then
            echo "::error::未配置 DEV_PUSH_TOKEN Secret"
            echo "::error::请在 ops 仓库 Settings → Secrets and variables → Actions 中配置"
            echo "::error::token 需对 mmw-devs/ffxiv-race-stats 有 contents:write + pull-requests:write"
            exit 1
          fi

          # 校验当前仓库
          if [ "$GITHUB_REPOSITORY" != "mmw-devs/ffxiv-race-ops" ]; then
            echo "::error::本 workflow 只能在 ops 仓库运行"
            echo "::error::当前仓库: $GITHUB_REPOSITORY"
            exit 1
          fi

          DEV_REPO="mmw-devs/ffxiv-race-stats"
          SHORT_SHA="${OPS_SHA::7}"
          BRANCH="ops-sync/data-${SHORT_SHA}"

          # 克隆 dev 仓库
          git clone "https://x-access-token:${DEV_PUSH_TOKEN}@github.com/${DEV_REPO}.git" dev-repo
          cd dev-repo
          git config user.name "ffxiv-race-ops-ci"
          git config user.email "ffxiv-race-ops-ci@users.noreply.github.com"

          # 基于 dev main 建同步分支（处理 dev 上可能存在的并发 commit）
          git fetch origin main
          git checkout -b "$BRANCH" origin/main

          # 复制 ops 的 data.json 到 dev
          mkdir -p agent-src/public
          cp ../public/data.json agent-src/public/data.json

          # 检查是否有变更
          if git diff --quiet; then
            echo "data.json 与 dev 一致，无需同步"
            exit 0
          fi

          # 提交
          git add agent-src/public/data.json
          git commit -m "chore(dev): sync data.json from ops (${SHORT_SHA})"

          # 同一 ops commit 重复触发时保持幂等
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::warning::分支 $BRANCH 已存在（同一 ops commit 已同步过），跳过"
            exit 0
          fi

          # push 分支
          git push -u origin "$BRANCH"

          # PR body 落到文件：多行文本只在 heredoc 里，不参与 YAML 缩进解析
          cat > /tmp/pr-body.md <<'EOF'
          ## 自动同步

          本 PR 由 ops 仓库 CI 自动生成，把真源 `public/data.json` 同步到 dev 的
          `agent-src/public/data.json`。

          - 真源仓库：`mmw-devs/ffxiv-race-ops`
          - ops commit：`__SHA__`
          - 同步分支：`__BRANCH__`

          合并后 dev 副本与 ops 真源逐字节一致。此分支前缀为 `ops-sync/`，
          dev 的 `build-verify` 会放行并校验副本结构完整性。
          EOF

          sed -i "s/__SHA__/${OPS_SHA}/g; s/__BRANCH__/${BRANCH}/g" /tmp/pr-body.md

          # 用 gh CLI 开 PR（使用 DEV_PUSH_TOKEN）
          GH_TOKEN="$DEV_PUSH_TOKEN" gh pr create \
            --repo "$DEV_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "chore(dev): sync data.json from ops (${SHORT_SHA})" \
            --body-file /tmp/pr-body.md

          echo "✓ data.json 已同步到 dev 仓库 PR（${BRANCH}）"
