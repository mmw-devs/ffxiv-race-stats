name: validate
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate data.json
        id: validate
        run: npx tsx scripts/validate-data.ts

      - name: Ensure data.json untouched (dev PR)
        if: ${{ !startsWith(github.head_ref, 'content/') }}
        run: |
          echo "::group::dev 分支 data.json 触碰检查"
          git fetch origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^public/data\.json$'; then
            # 仅当 base 分支已有 public/data.json 时阻断（允许首次创建）
            if git show "origin/${{ github.base_ref }}:public/data.json" >/dev/null 2>&1; then
              echo "::error::feature/* / fix/* PR 不得修改 public/data.json"
              echo "::error::数据值变更请走 content/* 分支（由运营 Agent 执行）"
              exit 1
            fi
            echo "⚠ public/data.json 首次引入（base 分支中不存在），允许通过"
          fi
          echo "检查通过"
          echo "::endgroup::"

      - name: Check file scope (content/* PR only)
        if: startsWith(github.head_ref, 'content/')
        run: |
          echo "::group::content/* 分支文件范围检查"
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          EXTRA=$(echo "$CHANGED" | grep -Ev '^public/data\.json$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::content/* PR 只能包含 public/data.json 变更，发现额外文件："
            echo "$EXTRA" | while read f; do
              echo "::error::  - $f"
            done
            exit 1
          fi
          echo "文件范围检查通过：仅 public/data.json"
          echo "::endgroup::"

      - name: Validate operation log (content/* PR only)
        if: startsWith(github.head_ref, 'content/')
        run: |
          echo "::group::操作日志校验"
          git fetch origin "${{ github.base_ref }}"
          npx tsx scripts/validate-op-log.ts "origin/${{ github.base_ref }}"
          echo "::endgroup::"
